name: Android APK

# Builds the INDcool Service Android app (a shell around the live CRM) on GitHub, so nothing has to be installed
# on a PC. Runs when the mobile folder changes, or by hand from the Actions tab (Run workflow).
# The APK is under the finished run, in Artifacts: INDcool-Service-apk.

on:
  push:
    branches: [main]
    paths:
      - "CRMPOC1/CRMPOC1/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CRMPOC1/CRMPOC1/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CRMPOC1/CRMPOC1/mobile/package-lock.json

      - name: Install Capacitor
        run: npm ci

      - name: Copy the app settings into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: CRMPOC1/CRMPOC1/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: INDcool-Service-apk
          path: CRMPOC1/CRMPOC1/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
